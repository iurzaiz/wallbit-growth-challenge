services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallbit
      POSTGRES_USER: wallbit
      POSTGRES_PASSWORD: wallbit
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallbit -d wallbit"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    # migrate/load_fixtures/simulate_visits are all idempotent (upsert or
    # get_or_create), so running them on every startup is safe — a plain
    # `docker compose up` is enough to get to a working, browsable state.
    command: >
      sh -c "
        python manage.py migrate &&
        python manage.py load_fixtures &&
        python manage.py simulate_visits &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - ./backend:/app
      - ./data:/data:ro
      - ./simulator:/simulator:ro
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATA_DIR=/data
      - SCENARIO_PATH=/simulator/scenario.json
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"

volumes:
  pgdata:
