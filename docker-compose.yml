services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wallbit
      POSTGRES_USER: wallbit
      POSTGRES_PASSWORD: wallbit
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallbit -d wallbit"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATA_DIR=/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

volumes:
  pgdata:
